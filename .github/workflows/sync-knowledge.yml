name: Sync Knowledge articles

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/build-articles.mjs
      - scripts/wiki.mjs
      - scripts/recommendation-pages.mjs
      - scripts/finder/**
      - recommendations.css
      - recommendations-ui.js
      - package.json
      - tests/wiki.test.mjs
      - tests/article-build.test.mjs
      - tests/recommendation-pages.test.mjs
      - .github/workflows/sync-knowledge.yml
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: knowledge-sheet-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read the current main Finder rules
        uses: actions/checkout@v4
        with:
          repository: to3b/local-llm-finder
          ref: main
          path: .finder-source
          persist-credentials: false

      - name: Test reference connections
        env:
          FINDER_SOURCE_ROOT: ${{ github.workspace }}/.finder-source/dist
        run: |
          node tests/wiki.test.mjs
          node tests/article-build.test.mjs
          node tests/recommendation-pages.test.mjs

      - name: Sync the shared design assets
        run: |
          cp .finder-source/dist/styles.css styles.css
          cp .finder-source/dist/docs.css docs.css
          cp .finder-source/dist/palette.css palette.css
          cp .finder-source/dist/sandbox-refine.css sandbox-refine.css

      - name: Build static Knowledge pages from Google Sheets
        env:
          KNOWLEDGE_BUILD_MODE: production
          FINDER_SOURCE_ROOT: ${{ github.workspace }}/.finder-source/dist
        run: node scripts/build-articles.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Knowledge articles from Google Sheet"
          git push
