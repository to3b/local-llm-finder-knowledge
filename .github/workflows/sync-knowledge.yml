name: Sync Knowledge articles

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: knowledge-sheet-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static Knowledge pages from Google Sheets
        run: node scripts/build-articles.mjs

      - name: Commit generated changes
        shell: bash
        run: |
          git add -A -- index.html sitemap.xml models hardware guides
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Knowledge articles from Google Sheet"
          git push
